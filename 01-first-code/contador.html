<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Contador</title>
  <style>
    body { background: #2e1065; color: #f5f5f5; }
    button { background: #4c1d95; color: #f5f5f5; border: 1px solid #a78bfa; }
  </style>
</head>
<body>
  <h1 id="valor">0</h1>
  <button onclick="cambiar(-1)">-</button>
  <button onclick="cambiar(1)">+</button>

  <script>
    let n = 0;
    function cambiar(d) {
      n += d;
      document.getElementById("valor").textContent = n;
    }
  </script>
</body>
</html>
